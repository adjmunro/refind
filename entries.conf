# Boot entries, in menu order. `{theme}` is replaced with the active theme's
# name by `refind-theme`, so icons follow the theme.
#
# Volumes are partition GUIDs (PARTUUID, see `lsblk -o NAME,PARTUUID`):
#   4b221d21-84b6-4d2d-9563-5100d01ac340  nvme0n1p3  CachyOS ESP (/boot), also holds rEFInd and Limine
#   fac9bf60-88c6-48fd-ba43-33268e15baf0  nvme1n1p1  Windows ESP, also holds Mint's shim + GRUB
# An entry without `volume` loads from rEFInd's own ESP.

menuentry "CachyOS" {
    icon   /EFI/refind/themes/{theme}/icons/os_cachyos.png
    loader /EFI/limine/limine_x64.efi
}

menuentry "Windows" {
    icon   /EFI/refind/themes/{theme}/icons/os_win.png
    volume fac9bf60-88c6-48fd-ba43-33268e15baf0
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Linux Mint" {
    icon   /EFI/refind/themes/{theme}/icons/os_mint.png
    volume fac9bf60-88c6-48fd-ba43-33268e15baf0
    loader /EFI/ubuntu/shimx64.efi
}
