# rEFInd configuration for magikarp.
#
# Generated by src/build.py from src/refind.conf.in + src/config.json; edit
# those in /data/repos/refind (github.com/adjmunro/refind), not this file.
# Changes made directly on the ESP are overwritten by the next deploy.
#
# Theme styling and the boot entries live in rotation/<theme>.conf and
# active-theme.conf, which `refind-theme` generates from
# themes/<name>/theme.conf + entries.conf.

timeout 10
default_selection "CachyOS"

# Native panel resolution; icons and backgrounds are drawn pixel-for-pixel for it.
resolution max
big_icon_size 128
small_icon_size 48

# Only the boot entries in entries.conf: no auto-detected kernels, fallback
# loaders, recovery partitions or duplicate shims.
scanfor manual

# Bottom row: power off, restart, reboot into firmware setup. The csr_rotate
# fillers show nothing (it's a Mac-only tool); they overwrite the rest of
# rEFInd's default tool list, which stock CachyOS rEFInd doesn't clear, so
# "about" and a second power/restart/firmware set don't appear.
showtools shutdown,reboot,firmware,csr_rotate,csr_rotate,csr_rotate,csr_rotate,csr_rotate,csr_rotate,csr_rotate,csr_rotate,csr_rotate

# Keep labels (the selected entry's name), hide the rest of the chrome.
hideui singleuser,hints,arrows,badges

# Must stay last so the theme can override anything above. With rotation on,
# our rEFInd (efi/) picks one theme_rotate file each time it starts and skips
# the include; stock rEFInd ignores theme_rotate and uses the include.
theme_rotate next rotation/minimal.conf rotation/ambience.conf rotation/sublime.conf rotation/synthwave.conf rotation/automata.conf rotation/magikarp.conf
include active-theme.conf
